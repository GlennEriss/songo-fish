[project]
name = "songo-ai"
version = "0.1.0"
description = "SongoFish: moteur de regles, professeur Alpha-Beta, dataset et reseau multi-tetes pour le Songo."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
# Runtime multi-provider : `songo-cloud run build|train|tournament ...`
# (equivalent a `python -m songo_ai.cloud ...`).
songo-cloud = "songo_ai.cloud.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
perf = ["numba>=0.60"]
train = ["torch>=2.3"]
table = ["pygame>=2.5"]
export = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]
# Coordinateur transactionnel du runner distribue Lot45 (lot45/distributed).
distributed = ["google-cloud-firestore>=2.16"]

[tool.pytest.ini_options]
testpaths = ["packages/songo_ai/tests", "apps/table/src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages"]
include = ["songo_ai*"]
